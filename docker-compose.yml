services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-avito_kitchen}
      POSTGRES_USER: ${DB_USER:-avito_kitchen}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-avito_kitchen}
    ports:
      # Host-side 5434: 5432/5433 are commonly already taken by native
      # Postgres installs. Containers still reach this service at
      # postgres:5432 over the compose network, so only host tools
      # (make migrate-up, psql) need to use 5434.
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-avito_kitchen} -d ${DB_NAME:-avito_kitchen}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrator:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate
    environment: &db_env
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-avito_kitchen}
      DB_PASSWORD: ${DB_PASSWORD:-avito_kitchen}
      DB_NAME: ${DB_NAME:-avito_kitchen}
      DB_SSLMODE: disable
    command: ["up"]
    depends_on:
      postgres:
        condition: service_healthy

  seed:
    build:
      context: .
      dockerfile: Dockerfile
      target: seed
    environment: *db_env
    depends_on:
      migrator:
        condition: service_completed_successfully

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    environment:
      <<: *db_env
      HTTP_PORT: "8080"
      LOG_LEVEL: info
      SHUTDOWN_TIMEOUT: 10s
    ports:
      - "8080:8080"
    depends_on:
      seed:
        condition: service_completed_successfully

volumes:
  postgres_data:
