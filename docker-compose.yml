services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-avito_kitchen}
      POSTGRES_USER: ${DB_USER:-avito_kitchen}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-avito_kitchen}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-avito_kitchen} -d ${DB_NAME:-avito_kitchen}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      HTTP_PORT: "8080"
      LOG_LEVEL: info
      SHUTDOWN_TIMEOUT: 10s
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-avito_kitchen}
      DB_PASSWORD: ${DB_PASSWORD:-avito_kitchen}
      DB_NAME: ${DB_NAME:-avito_kitchen}
      DB_SSLMODE: disable
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
